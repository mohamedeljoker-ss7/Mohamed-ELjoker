<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة MOHAMED ELJOKER التعليمية | الجامعة التكنولوجية - قسم تكنولوجيا المعلومات IT</title>
    <meta name="description" content="منصة MOHAMED ELJOKER التعليمية المجانية بالكامل لتنظيم ونشر المحاضرات والسكاشن والامتحانات وشيتات قسم تكنولوجيا المعلومات IT." />
    <!-- Single Page Apps for GitHub Pages Routing Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else {
          var params = new URLSearchParams(l.search);
          var p = params.get('p');
          if (p) {
            var q = params.get('q');
            var cleanSearch = q ? '?' + q.replace(/~and~/g, '&') : '';
            var rawTarget = p.startsWith('/') ? p : '/' + p;
            var target = rawTarget.length > 1 ? rawTarget.replace(/\/+$/, '') : '';
            var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
            window.history.replaceState(null, null, (basePath + (target || '/')) + cleanSearch + l.hash);
          }
        }
      }(window.location));
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('academy_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
