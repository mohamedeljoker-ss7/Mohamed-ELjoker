<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة MOHAMED ELJOKER التعليمية | قسم تكنولوجيا المعلومات IT</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (handles both user/org sites and project repository subpaths)
      (function(l) {
        var knownRoutes = ['admin', 'student', 'home', 'courses', 'course-details', 'teacher', 'articles', 'news', 'contact', 'privacy', 'terms', 'admin-panel', 'student-panel', 'subscription-required', 'player'];
        var segments = l.pathname.split('/').filter(Boolean);
        var isGithubIo = l.hostname.endsWith('github.io');
        var firstSeg = segments.length > 0 ? segments[0].toLowerCase() : '';
        var segmentsToKeep = (isGithubIo && segments.length > 0 && knownRoutes.indexOf(firstSeg) === -1) ? 1 : 0;

        var baseSegs = segments.slice(0, segmentsToKeep);
        var routeSegs = segments.slice(segmentsToKeep);
        var basePath = baseSegs.length ? ('/' + baseSegs.join('/')) : '';

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          basePath + '/?p=/' +
          routeSegs.join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }(window.location));
    </script>
  </head>
  <body style="background-color: #030712; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; padding: 20px;">
      <h2 style="color: #06b6d4; margin-bottom: 8px;">جاري التحويل إلى منصة الجامعة التكنولوجية (IT)...</h2>
      <p style="color: #94a3b8; font-size: 14px;">MOHAMED ELJOKER — Information Technology Department</p>
    </div>
  </body>
</html>
